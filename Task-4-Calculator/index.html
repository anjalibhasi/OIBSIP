<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaCalc | Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div>
                <h1>NovaCalc</h1>
                <p>Smart & Simple Calculator</p>
            </div>

            <button id="themeBtn" class="theme-btn">☀</button>
        </header>


        <main class="calculator-container">

            <!-- Calculator -->
            <section class="calculator">

                <div class="display">
                    <div id="previousDisplay" class="previous"></div>
                    <div id="currentDisplay" class="current">0</div>
                </div>


                <div class="buttons">

                    <button class="btn function" data-action="clear">
                        AC
                    </button>

                    <button class="btn function" data-action="delete">
                        DEL
                    </button>

                    <button class="btn function" data-action="percent">
                        %
                    </button>

                    <button class="btn operator" data-operation="/">
                        ÷
                    </button>


                    <button class="btn" data-number="7">7</button>
                    <button class="btn" data-number="8">8</button>
                    <button class="btn" data-number="9">9</button>

                    <button class="btn operator" data-operation="*">
                        ×
                    </button>


                    <button class="btn" data-number="4">4</button>
                    <button class="btn" data-number="5">5</button>
                    <button class="btn" data-number="6">6</button>

                    <button class="btn operator" data-operation="-">
                        −
                    </button>


                    <button class="btn" data-number="1">1</button>
                    <button class="btn" data-number="2">2</button>
                    <button class="btn" data-number="3">3</button>

                    <button class="btn operator" data-operation="+">
                        +
                    </button>


                    <button class="btn zero" data-number="0">
                        0
                    </button>

                    <button class="btn" data-number=".">
                        .
                    </button>

                    <button class="btn equal" data-action="calculate">
                        =
                    </button>

                </div>

            </section>


            <!-- History -->
            <section class="history">

                <div class="history-header">
                    <h2>History</h2>

                    <button id="clearHistory">
                        Clear
                    </button>
                </div>

                <div id="historyList" class="history-list">
                    <p class="empty-history">
                        No calculations yet
                    </p>
                </div>

            </section>

        </main>


        <footer>
            <p>OIBSIP Web Development & Designing — Task 4</p>
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
